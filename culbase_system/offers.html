<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Kayıtlı İşler</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body class="light-mode">
    <div class="nightmode">
        <div id="globalWelcome" class="welcome-text"></div>
        <label class="switch">
            <input id="checkbox" type="checkbox" />
            <span class="slider">
                <div class="star star_1"></div>
                <div class="star star_2"></div>
                <div class="star star_3"></div>
                <svg viewBox="0 0 16 16" class="cloud_1 cloud">
                    <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff"
                        d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925">
                    </path>
                </svg>
            </span>
        </label>
    </div>
    <div class="header_container">
        <div class="main_back">
            <img src="CULBASEpng.png" class="main_logo" alt="CULBASE Logo" onerror="this.style.display='none'">
        </div>
        <div class="input" id="main_button">
            <button class="value" onclick="window.location.href='ana_sayfa.html'"><svg viewBox="0 0 16 16"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="m1.5 13v1a.5.5 0 0 0 .3379.4731 18.9718 18.9718 0 0 0 6.1621 1.0269 18.9629 18.9629 0 0 0 6.1621-1.0269.5.5 0 0 0 .3379-.4731v-1a6.5083 6.5083 0 0 0 -4.461-6.1676 3.5 3.5 0 1 0 -4.078 0 6.5083 6.5083 0 0 0 -4.461 6.1676zm4-9a2.5 2.5 0 1 1 2.5 2.5 2.5026 2.5026 0 0 1 -2.5-2.5zm2.5 3.5a5.5066 5.5066 0 0 1 5.5 5.5v.6392a18.08 18.08 0 0 1 -11 0v-.6392a5.5066 5.5066 0 0 1 5.5-5.5z">
                    </path>
                </svg>Ana Sayfa</button>
            <button class="value" onclick="window.location.href='panodizayn.html'"><svg viewBox="0 0 32 32"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6v20h24V6H4zm2 2h20v16H6V8zm4 2v2h12v-2H10zm0 4v2h8v-2h-8zm0 4v2h12v-2H10z"
                        fill="#7D8590" />
                </svg>Pano Tasarım</button>
            <button class="value" onclick="window.location.href='yapilanisler.html'"><svg viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
                </svg>Teklif Oluştur</button>
            <button class="value" onclick="window.location.href='offers.html'"><svg viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z" />
                </svg>Kayıtlı İşler</button>
            <button class="value" onclick="window.location.href='stok.html'"><svg viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"></path>
                </svg>Stok Yönetimi</button>
            <button class="value" onclick="logout()" style="color: #ff4c4c;"><svg viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                        fill="#ff4c4c" />
                </svg>Çıkış Yap</button>
        </div>
    </div>
    <div class="offer-container">
        <h2 style="text-align: center;" class="offer-title">Geçmiş Teklifler ve Kayıtlı İşler</h2>
        <div style="overflow-x: auto;">
            <table class="offer-table">
                <thead>
                    <tr>
                        <th>Teklif No</th>
                        <th>Firma Adı</th>
                        <th>Tarih</th>
                        <th>Genel Toplam</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="savedOffersTableBody"></tbody>
            </table>
        </div>
    </div>
    <!-- ==========================================
         KAYITLI İŞLER: DÜZENLEME VE DOSYA YÜKLEME MODALI
         ========================================== -->
    <div id="edit-offer-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#1a1a1a; padding:25px; border-radius:8px; border:1px solid #00d2ff; width:90%; max-width:500px; color:#fff;">
            <h3 style="color:#00d2ff; margin-top:0; border-bottom:1px solid #333; padding-bottom:10px;">İşi Düzenle & Dosya Ekle</h3>
            
            <label style="font-size:12px; color:#aaa;">Firma / Proje Adı:</label>
            <input type="text" id="edit-company" style="width:100%; margin-bottom:15px; padding:10px; background:#000; color:#fff; border:1px solid #444; border-radius:4px; margin-top:5px; box-sizing:border-box;">
            
            <label style="font-size:12px; color:#aaa;">Toplam Bütçe (₺):</label>
            <input type="text" id="edit-total" style="width:100%; margin-bottom:15px; padding:10px; background:#000; color:#fff; border:1px solid #444; border-radius:4px; margin-top:5px; box-sizing:border-box;">
            
            <label style="font-size:12px; color:#27ae60; font-weight:bold;">Kaynak Dosya Ekle (Görsel/PDF vb.):</label>
            <input type="file" id="offer-file-upload" onchange="attachOfferFile(event)" style="width:100%; margin-bottom:10px; margin-top:5px;">
            <div id="attached-files-list" style="font-size:12px; color:#aaa; margin-bottom:20px; max-height:100px; overflow-y:auto; background:#000; padding:10px; border-radius:4px; border:1px dashed #333;">Henüz dosya eklenmedi.</div>

            <div style="display:flex; gap:10px;">
                <button onclick="saveOfferDetails()" style="flex:1; padding:12px; background:#27ae60; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Değişiklikleri Kaydet</button>
                <button onclick="document.getElementById('edit-offer-modal').style.display='none'" style="flex:1; padding:12px; background:#e74c3c; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">İptal</button>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
